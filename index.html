<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>氣候資料與風險評估資源彙整</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
    }

    /* 標題列（資料型） */
    .hero {
      background: #2c4f73;
      color: white;
      padding: 18px 20px;
      text-align: left;
    }

    .hero h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }

    .hero p {
      font-size: 13px;
      opacity: 0.75;
      margin-top: 4px;
    }

    /* 卡片區（可擴充 Grid） */
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
      max-width: 1100px;
      margin: 45px auto;
      padding: 0 20px;
    }

    /* 卡片（資料條目型） */
    .card {
      background: #ffffff;
      padding: 20px;
      border: 1px solid #e3e7eb;
      border-radius: 4px;
    }

    .card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 14px;
      margin: 6px 0 10px 0;
      line-height: 1.5;
    }

    .card ul {
      padding-left: 18px;
      margin: 0 0 10px 0;
      font-size: 13px;
    }

    .card li {
      margin-bottom: 4px;
    }

    /* 索引式連結 */
    .card a {
      display: inline-block;
      margin-top: 8px;
      font-size: 14px;
      color: #2c4f73;
      text-decoration: underline;
    }

    /* Logo */
    .card img {
      margin-top: 10px;
      max-height: 36px;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>氣候資料與風險評估資源彙整</h1>
    <p>Climate Data & Risk Assessment Resources</p>
  </div>

  <div class="card-container">

    <!-- TCCIP -->
    <div class="card">
      <h3>TCCIP</h3>
      <p>臺灣氣候變遷推估資訊與應用平台</p>
      <ul>
        <li>氣候情境推估資料</li>
        <li>空間圖資查詢</li>
        <li>風險評估應用</li>
      </ul>
      <a href="https://tccip.ncdr.nat.gov.tw/" target="_blank">
        前往平台
      </a><br>
      <img src="images/tccip.png" alt="TCCIP Logo">
    </div>

    <!-- DRA -->
    <div class="card">
      <h3>DRA</h3>
      <p>災害風險分析與管理平台</p>
      <ul>
        <li>災害潛勢分析</li>
        <li>風險評估模型</li>
        <li>決策支援資訊</li>
      </ul>
      <a href="https://dra.ncdr.nat.gov.tw/" target="_blank">
        前往平台
      </a><br>
      <img src="images/dra.png" alt="DRA Logo">
    </div>

    <!-- 政策頁 -->
    <div class="card">
      <h3>氣候變遷因應政策</h3>
      <p>國家氣候變遷政策與推動方向</p>
      <ul>
        <li>政策架構</li>
        <li>行動計畫</li>
        <li>相關法規</li>
      </ul>
      <a href="https://www.cca.gov.tw/affairs/response-policies/1999.html" target="_blank">
        前往政策頁
      </a><br>
      <img src="images/cca.png" alt="CCA Logo">
    </div>

  </div>

</body>
</html>
