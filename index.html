<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氣候資料與風險評估資源索引</title>

<style>
body {
    margin: 0;
    font-family: "Microsoft JhengHei", sans-serif;
    background-color: #f2f6fa; /* 藍灰背景 */
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* 標題區 */
.header {
    background-color: #2f4f6f;
    color: white;
    padding: 40px 20px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header p {
    margin-top: 8px;
    font-size: 14px;
    opacity: 0.85;
}

/* 主體區 */
.main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
}

.card-container {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
}

/* 卡片 */
.card {
    background: white;
    width: 360px;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06); /* 強化陰影 */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.card h3 {
    margin-top: 0;
    font-size: 18px;
}

.card ul {
    padding-left: 18px;
    margin: 15px 0;
    font-size: 14px;
    line-height: 1.6;
}

.card a {
    font-size: 14px;
    text-decoration: none;
    color: #2f4f6f;
    font-weight: bold;
}

.logo {
    margin-top: 20px;
    text-align: right;
}

.logo img {
    height: 40px;
}

/* Footer */
.footer {
    background-color: #2f4f6f;
    color: white;
    text-align: center;
    padding: 16px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="header">
    <h1>氣候資料與風險評估資源索引</h1>
    <p>Climate Data and Risk Assessment Index</p>
</div>

<div class="main">
    <div class="card-container">

        <div class="card">
            <div>
                <h3>TCCIP</h3>
                <ul>
                    <li>氣候情境推估資料</li>
                    <li>空間圖資查詢</li>
                    <li>風險評估應用</li>
                </ul>
                <a href="https://tccip.ncdr.nat.gov.tw/" target="_blank">前往平台</a>
            </div>
            <div class="logo">
                <img src="images/tccip.png" alt="TCCIP Logo">
            </div>
        </div>

        <div class="card">
            <div>
                <h3>Dr.A</h3>
                <ul>
                    <li>災害風險分析</li>
                    <li>風險評估模型</li>
                    <li>決策支援資訊</li>
                </ul>
                <a href="https://dra.ncdr.nat.gov.tw/" target="_blank">前往平台</a>
            </div>
            <div class="logo">
                <img src="images/dra.png" alt="DRA Logo">
            </div>
        </div>

        <div class="card">
            <div>
                <h3>氣候變遷因應政策</h3>
                <ul>
                    <li>政策架構</li>
                    <li>行動計畫</li>
                    <li>相關法規</li>
                </ul>
                <a href="https://www.cca.gov.tw/affairs/response-policies/1999.html" target="_blank">前往政策頁</a>
            </div>
            <div class="logo">
                <img src="images/cca.png" alt="CCA Logo">
            </div>
        </div>

    </div>
</div>

<div class="footer">
    本專區資料彙整與維護單位：國立臺東大學防災科技資訊中心
</div>

</body>
</html>
